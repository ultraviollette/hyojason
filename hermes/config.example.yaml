# 효자손 (hyojason) 프로필 설정 예시
# 모델: 현재 사용 중인 모델 그대로
# 키 값은 .env 의 ANTHROPIC_API_KEY 에서 읽는다.
model:
  default: claude-sonnet-4-5
  provider: anthropic
  base_url: https://api.anthropic.com/v1
  api_mode: anthropic_messages

# AI Gateway (아직 적용 안 함): Cloudflare AI Gateway를 거치게 할 때 이 자리에 설정한다.
#   base_url: https://gateway.ai.cloudflare.com/v1/<ACCOUNT_ID>/<GATEWAY_ID>/anthropic

# MCP: shopping_tools (stdio MCP 서버)
mcp_servers:
  hyojason_tools:
    command: uv
    args:
      - run
      - --project
      - <REPO>/mcp
      - python
      - -m
      - shopping_tools.server
    env:
      HYOJASON_CLIENTS_DIR: <REPO>/clients
      TYPESAFE_API_KEY: ${TYPESAFE_API_KEY}
      COUPANG_ACCESS_KEY: ${COUPANG_ACCESS_KEY}   # 쿠팡 파트너스 (승인 후)
      COUPANG_SECRET_KEY: ${COUPANG_SECRET_KEY}

# API 서버는 아직 활성화하지 않음 (조건 c: 미가동)
# (platforms.api_server 블록 없음)
