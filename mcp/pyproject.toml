[project]
name = "hyojason-shopping-tools"
version = "0.1.0"
description = "효자손 MCP tools: Naver shopping search, product verification (Jev gates), client profiles"
requires-python = ">=3.11"
dependencies = [
  "mcp>=1.2",
  "httpx>=0.27",
  "pyyaml>=6",
  "beautifulsoup4>=4.12",
]

[project.optional-dependencies]
jev = ["jev"]          # Jev System One Python SDK (패키지명은 강의 기준으로 확인)
dev = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["shopping_tools"]
