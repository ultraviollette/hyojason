[project]
name = "hyojason-shopping-tools"
version = "0.1.0"
description = "효자손 MCP tools: Naver shopping search, product verification (Jev gates), client profiles"
requires-python = ">=3.14"   # jev(TypeSafe System One SDK) 가 3.14+ 만 지원. uv 가 3.14 를 자동 설치한다.
dependencies = [
  "mcp>=1.2",
  "httpx>=0.27",
  "pyyaml>=6",
  "beautifulsoup4>=4.12",
  "pydantic>=2",
  "jev>=0.3",               # Jev 게이트. 키: TYPESAFE_API_KEY (없으면 규칙 폴백으로 동작)
]

[project.optional-dependencies]
dev = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["shopping_tools"]
