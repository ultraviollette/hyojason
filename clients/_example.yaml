# 클라이언트 프로필 양식
# 실제 파일은 clients/<client_id>.yaml 로 만들고 git에 올리지 않는다 (.gitignore 처리됨).
# 파일은 save_client_profile 도구만 쓴다. 키는 이 양식으로 코드가 강제한다 (mcp/shopping_tools/profiles.py).
# client_id = 파일 이름 = <채널>-<채널 사용자 ID 의 sha256 앞 16자>  예: kakao-2cd5f0bbd4737468
# 옛 형식 파일은 python -m shopping_tools.migrate_profiles 로 옮긴다.

client_id: example-mom
display_name: 어머니            # 에이전트가 부르는 호칭
language: ko
tone: elder-polite             # elder-polite | casual | formal

channels:
  kakao_user_id: ""            # 카카오 챗봇 userRequest.user.id (처음 대화 때 자동 채움)
  telegram_chat_id: ""

body:
  top_size: ""                 # 예: "55" 또는 "M"
  bottom_size: ""
  shoe_size_mm: ""             # 예: "235"
  height_cm: ""
  notes: ""                    # 예: "팔·다리·어깨가 짧은 편. 소매 긴 옷은 줄여야 함"

preferences:
  likes:
    - ""                       # 예: "여성스러운 핏", "스카프", "챙 넓은 모자"
  dislikes:                    # Jev 게이트 violates_profile 에 쓰임
    - ""                       # 예: "목이 파인 옷", "오버사이즈 핏", "캐주얼 운동화", "야구모자"
  brands_ok: []
  brands_avoid: []
  price_sensitivity: medium    # low | medium | high

shopping_rules:
  default_deadline_days: null  # 기한을 말하지 않으면 묻는다 (null) / 숫자면 기본값
  allow_overseas_when_no_deadline: true
  max_candidates: 3

delivery:
  region: ""                   # 예: "지방 중소도시" — 도착일 계산용 (정확한 주소는 저장하지 않는다)

payment:                       # 처음 후보를 드리는 답에서 한 번만 묻는다. 결제 정보·다른 사람 연락처는 저장하지 않는다
  place: ""                    # 주로 사는 곳(자유 입력, 20자 이내). 예: "쿠팡", "네이버"
  by: ""                       # "" (모름) | self (본인) | family (다른 가족)
  asked_on: ""                 # 결제 방식을 물어본 날. record_item 이 채운다. 채워지면 다시 묻지 않는다(평생 한 번)

notes: []                      # 위 칸에 없는 기타 메모 (예: "라인댄스를 함")

items: []                      # 찾아 드린(found)·고르신(chosen) 물건. record_item 도구만 쓴다. 최근 50건, 최신이 앞
# 예시 (가짜 값):
#  - date: "2026-01-01"
#    status: chosen             # found(찾아 드림) | chosen(고르심). 실제 결제 여부는 기록하지 않는다
#    brand: "예시브랜드"
#    name: "예시 보온병"
#    options: {용량: "240ml", 색: "네이비"}
#    seller: "예시몰"
#    seen_price_krw: 10000      # 그때 본 가격. 확인 못 했으면 null

history: []                    # 예전 log_recommendation 의 기록. 읽기만 하고 더 쓰지 않는다
